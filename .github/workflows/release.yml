name: Desktop release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable version tag to release (vMAJOR.MINOR.PATCH)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: torque-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve release tag
        id: release
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG_INPUT" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Only stable vMAJOR.MINOR.PATCH tags can be published. Received: $RELEASE_TAG_INPUT"
            exit 1
          fi
          echo "tag=$RELEASE_TAG_INPUT" >> "$GITHUB_OUTPUT"

      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - name: Confirm all application versions match the tag
        id: version
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const packageJson = JSON.parse(readFileSync('package.json', 'utf8'));
          const tauri = JSON.parse(readFileSync('src-tauri/tauri.conf.json', 'utf8'));
          const cargoToml = readFileSync('src-tauri/Cargo.toml', 'utf8');
          const cargoLock = readFileSync('src-tauri/Cargo.lock', 'utf8');
          const cargoVersion = cargoToml.match(/^version\s*=\s*"([^"]+)"/m)?.[1];
          const cargoLockVersion = cargoLock.match(/^\[\[package\]\]\r?\nname = "torque"\r?\nversion = "([^"]+)"/m)?.[1];
          const versions = [packageJson.version, tauri.version, cargoVersion, cargoLockVersion];
          const expectedVersion = process.env.RELEASE_TAG.slice(1);

          if (versions.some((version) => version !== expectedVersion)) {
            console.error(`Tag ${process.env.RELEASE_TAG} must match package.json, tauri.conf.json, Cargo.toml, and the Torque Cargo.lock entry.`);
            process.exit(1);
          }

          console.log(`Validated stable Torque version ${expectedVersion}.`);
          NODE
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

  quality:
    name: Validate application
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.release_tag }}

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libfuse2 \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf \
            rpm \
            wget \
            xdg-utils

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm typecheck

      - name: Frontend production build
        run: pnpm build

      - name: Release-tool and updater-version tests
        run: |
          pnpm release:test
          pnpm updater:test

      - name: Release-manifest validation tests
        run: python -m unittest discover -s scripts -p 'test_*.py'

      - name: Validate updater configuration
        run: pnpm updater:config

      - name: Rust formatting check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Rust check and tests
        run: |
          cargo check --manifest-path src-tauri/Cargo.toml
          cargo test --manifest-path src-tauri/Cargo.toml

  build:
    name: Build ${{ matrix.name }}
    needs:
      - validate
      - quality
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # tauri-action merges its platform entry into the draft latest.json.
      # Serial jobs avoid concurrent read/delete/upload races on that one asset.
      max-parallel: 1
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macOS Apple Silicon
            runner: macos-15
            target: aarch64-apple-darwin
          - name: macOS Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - name: Linux x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.release_tag }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libfuse2 \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf \
            rpm \
            wget \
            xdg-utils

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check updater signing secrets
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo "::error::Configure the TAURI_SIGNING_PRIVATE_KEY Actions secret before publishing releases."
            exit 1
          fi

      - name: Build and upload signed release artifacts
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }}
          tagName: ${{ needs.validate.outputs.release_tag }}
          releaseName: Torque ${{ needs.validate.outputs.release_tag }}
          releaseBody: Installers and signed updater artifacts for Torque ${{ needs.validate.outputs.release_tag }}.
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          retryAttempts: 2
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true

  publish:
    name: Validate and publish stable release
    needs:
      - validate
      - build
    if: needs.build.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.release_tag }}

      - name: Validate draft assets and updater manifest
        id: validate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: python scripts/validate_release.py

      - name: Publish stable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.validate.outputs.release_id }}
        run: >-
          gh api --method PATCH
          "/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}"
          -F draft=false
          -F prerelease=false
          -F make_latest=true
