name: Desktop release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable version tag to release (vMAJOR.MINOR.PATCH)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: torque-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve release tag
        id: release
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG_INPUT" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Only stable vMAJOR.MINOR.PATCH tags can be published. Received: $RELEASE_TAG_INPUT"
            exit 1
          fi
          echo "tag=$RELEASE_TAG_INPUT" >> "$GITHUB_OUTPUT"

      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - name: Confirm all application versions match the tag
        id: version
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const packageJson = JSON.parse(readFileSync('package.json', 'utf8'));
          const tauri = JSON.parse(readFileSync('src-tauri/tauri.conf.json', 'utf8'));
          const cargoToml = readFileSync('src-tauri/Cargo.toml', 'utf8');
          const cargoLock = readFileSync('src-tauri/Cargo.lock', 'utf8');
          const cargoVersion = cargoToml.match(/^version\s*=\s*"([^"]+)"/m)?.[1];
          const cargoLockVersion = cargoLock.match(/^\[\[package\]\]\r?\nname = "torque"\r?\nversion = "([^"]+)"/m)?.[1];
          const versions = [packageJson.version, tauri.version, cargoVersion, cargoLockVersion];
          const expectedVersion = process.env.RELEASE_TAG.slice(1);

          if (versions.some((version) => version !== expectedVersion)) {
            console.error(`Tag ${process.env.RELEASE_TAG} must match package.json, tauri.conf.json, Cargo.toml, and the Torque Cargo.lock entry.`);
            process.exit(1);
          }

          console.log(`Validated stable Torque version ${expectedVersion}.`);
          NODE
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # tauri-action merges its platform entry into the draft latest.json.
      # Serial jobs avoid concurrent read/delete/upload races on that one asset.
      max-parallel: 1
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macOS Apple Silicon
            runner: macos-15
            target: aarch64-apple-darwin
          - name: macOS Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - name: Linux x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.release_tag }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libfuse2 \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf \
            rpm \
            wget \
            xdg-utils

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check updater signing secrets
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo "::error::Configure the TAURI_SIGNING_PRIVATE_KEY Actions secret before publishing releases."
            exit 1
          fi

      - name: Build and upload signed release artifacts
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }}
          tagName: ${{ needs.validate.outputs.release_tag }}
          releaseName: Torque ${{ needs.validate.outputs.release_tag }}
          releaseBody: Installers and signed updater artifacts for Torque ${{ needs.validate.outputs.release_tag }}.
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          retryAttempts: 2
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true

  publish:
    name: Validate and publish stable release
    needs:
      - validate
      - build
    if: needs.build.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Validate draft assets and updater manifest
        id: validate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["RELEASE_TAG"]
          version = os.environ["RELEASE_VERSION"]
          token = os.environ["GH_TOKEN"]

          def github_get(url, accept="application/vnd.github+json"):
              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": accept,
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return response.read()

          api_root = os.environ.get("GITHUB_API_URL", "https://api.github.com")
          release = json.loads(github_get(f"{api_root}/repos/{repository}/releases/tags/{tag}"))
          if release["tag_name"] != tag or not release["draft"] or release["prerelease"]:
              raise SystemExit("Expected a draft stable release; refusing to publish unexpected release state.")

          assets = {asset["name"]: asset for asset in release["assets"]}
          if "latest.json" not in assets:
              raise SystemExit("tauri-action did not produce latest.json.")
          manifest = json.loads(
              github_get(assets["latest.json"]["url"], "application/octet-stream")
          )
          if manifest.get("version") != version:
              raise SystemExit(f"latest.json version must be {version}.")

          expected_platforms = {
              "windows-x86_64",
              "darwin-aarch64",
              "darwin-x86_64",
              "linux-x86_64",
          }
          platforms = manifest.get("platforms", {})
          missing = expected_platforms - platforms.keys()
          if missing:
              raise SystemExit(f"latest.json is missing platform entries: {', '.join(sorted(missing))}")

          asset_urls = {
              url
              for asset in release["assets"]
              for url in (asset["url"], asset["browser_download_url"])
          }
          for platform, entry in platforms.items():
              if not entry.get("signature") or not entry.get("url", "").startswith("https://"):
                  raise SystemExit(f"latest.json has an invalid updater entry for {platform}.")
              if entry["url"] not in asset_urls:
                  raise SystemExit(f"latest.json points {platform} at an asset missing from this release.")

          names = list(assets)
          checks = {
              "Windows NSIS installer": any(name.lower().endswith(".exe") and "setup" in name.lower() for name in names),
              "Windows MSI installer": any(name.lower().endswith(".msi") for name in names),
              "macOS disk image": any(name.lower().endswith(".dmg") for name in names),
              "macOS signed updater archive": any(name.lower().endswith(".app.tar.gz.sig") for name in names),
              "Linux Debian package": any(name.lower().endswith(".deb") for name in names),
              "Linux RPM package": any(name.lower().endswith(".rpm") for name in names),
              "Linux AppImage": any(".appimage" in name.lower() and not name.lower().endswith(".sig") for name in names),
          }
          missing_assets = [label for label, present in checks.items() if not present]
          if missing_assets:
              raise SystemExit(f"Release is missing required artifacts: {', '.join(missing_assets)}")
          if sum(name.lower().endswith(".sig") for name in names) < 4:
              raise SystemExit("Release is missing one or more updater signature assets.")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"release_id={release['id']}\n")
          print(f"Validated {len(platforms)} signed updater entries and all supported platform installers.")
          PY

      - name: Publish stable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.validate.outputs.release_id }}
        run: >-
          gh api --method PATCH
          "/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}"
          -F draft=false
          -F prerelease=false
          -F make_latest=true
